<svg
    xmlns="http://www.w3.org/2000/svg"
    width="960"
    height="240"
    viewBox="0 0 960 240"
    role="img"
    aria-label="BorgerBytes logo"
>
    <!-- Icon -->
    <rect width="240" height="240" rx="52" fill="#0f172a"/>

    <g transform="translate(-5 7)">
        <!-- Amber "I" bracket -->
        <g fill="#f59e0b">
            <rect x="68" y="36" width="8" height="154" rx="2"/>
            <rect x="58" y="36" width="28" height="8" rx="3"/>
            <rect x="58" y="182" width="28" height="8" rx="3"/>
        </g>

        <!-- Terminal window -->
        <rect x="93" y="43" width="92" height="62" rx="10" fill="none" stroke="#2f6c9e" stroke-width="14"/>
        <path d="M116 62l14 12-14 12" fill="none" stroke="#2f6c9e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="138" y="82" width="20" height="7" rx="2" fill="#2f6c9e"/>

        <!-- Byte grid -->
        <rect x="90" y="126" width="98" height="60" rx="9" fill="none" stroke="#2f6c9e" stroke-width="8"/>
        <g fill="#38bdf8" fill-opacity=".3">
            <rect x="98" y="137" width="16" height="16" rx="3"/>
            <rect x="120" y="137" width="16" height="16" rx="3" fill="#2f6c9e" fill-opacity="1"/>
            <rect x="142" y="137" width="16" height="16" rx="3"/>
            <rect x="164" y="137" width="16" height="16" rx="3"/>
            <rect x="98" y="159" width="16" height="16" rx="3"/>
            <rect x="120" y="159" width="16" height="16" rx="3"/>
            <rect x="142" y="159" width="16" height="16" rx="3" fill="#2f6c9e" fill-opacity="1"/>
            <rect x="164" y="159" width="16" height="16" rx="3"/>
        </g>
    </g>

    <!-- Wordmark -->
    <text
        x="272"
        y="148"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104"
        font-weight="800"
        fill="#0f172a"
    >Borger<tspan
        font-family="Consolas, Menlo, 'Courier New', monospace"
        font-weight="700"
        fill="#2f6c9e"
    >Bytes</tspan></text>

    <text
        x="276"
        y="196"
        font-family="Consolas, Menlo, 'Courier New', monospace"
        font-size="26"
        letter-spacing="3"
        fill="#64748b"
    >&lt;software /&gt;</text>
</svg>